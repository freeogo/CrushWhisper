<!DOCTYPE html>
<html>
<head>
  <title>MindMate 分析助手</title>
  <meta charset="UTF-8">
  <link rel="icon" href="images/icon16.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

    :root {
      --primary-color: #007bff; /* Blue - can be changed for a more 'tech' feel */
      --secondary-color: #6c757d; /* Grey */
      --background-color: #f4f7f9; /* Light grey background */
      --text-color: #333;
      --border-color: #d1d9e0;
      --accent-color: #17a2b8; /* Teal/Cyan - for tech accents */
      --font-family: 'Roboto', sans-serif;
      --container-width: 420px;
      --popup-max-height: 590px;
    }

    /* Dark theme variant (optional, can be toggled with JS later if desired) */
    /*
    body.dark-theme {
      --primary-color: #00a1ff;
      --secondary-color: #8a939b;
      --background-color: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #444;
      --accent-color: #00d1ff;
    }
    */

    body {
      font-family: var(--font-family);
      background-color: var(--background-color);
      color: var(--text-color);
      width: var(--container-width);
      max-height: var(--popup-max-height);
      overflow-y: auto;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-size: 14px;
      line-height: 1.6;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header h3 {
      font-size: 1.5em; /* 24px */
      color: var(--primary-color);
      text-align: center;
      margin: 0 0 15px 0;
      font-weight: 500;
    }

    #pasteArea {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background-color: #fff;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    #pasteArea.highlight { /* For drag-over effects if implemented later */
      border-color: var(--primary-color);
      background-color: #e9f5ff;
    }

    #pasteArea.pasted img {
        max-width: 100%;
        max-height: 150px; /* Limit preview height */
        border-radius: 4px;
        margin-top: 10px;
    }

    #pastePlaceholder {
      color: var(--secondary-color);
      font-size: 1.1em;
    }

    #pastePlaceholder .icon {
        font-size: 2em;
        margin-bottom: 10px;
    }

    #loading {
      text-align: center;
      padding: 15px;
      font-size: 1.1em;
      color: var(--accent-color);
      display: none; /* Hidden by default */
    }

    #resultsContainer {
      background-color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      display: none; /* Hidden by default, shown by JS */
      white-space: pre-wrap; /* Keep newlines from Markdown */
    }

    #resultsContainer h3, #resultsContainer h4 {
        color: var(--primary-color);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 5px;
        margin-top: 15px;
        margin-bottom: 10px;
    }
    #resultsContainer h3:first-child {
        margin-top: 0;
    }
    #resultsContainer h4 {
        color: var(--accent-color);
        font-size: 1.1em;
    }
    #resultsContainer .option {
        background-color: #f9fafb; /* Slightly different from body bg */
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 15px;
    }
    #resultsContainer ul {
        padding-left: 20px;
        list-style-type: disc; /* Or 'circle' or 'square' */
    }
    #resultsContainer li {
        margin-bottom: 8px;
    }
    #resultsContainer em { /* For blockquotes from markdown > */
        display: block;
        padding: 8px;
        margin: 10px 0;
        background-color: #eef7ff;
        border-left: 3px solid var(--primary-color);
        color: #2c3e50;
    }
    #resultsContainer hr {
        border: 0;
        height: 1px;
        background-color: var(--border-color);
        margin: 20px 0;
    }

    /* Scrollbar styling for a more 'tech' feel */
    body::-webkit-scrollbar {
      width: 8px;
    }
    body::-webkit-scrollbar-track {
      background: var(--background-color);
    }
    body::-webkit-scrollbar-thumb {
      background-color: var(--accent-color);
      border-radius: 10px;
      border: 2px solid var(--background-color);
    }
    body::-webkit-scrollbar-thumb:hover {
      background-color: var(--primary-color);
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <h3>MindMate 分析助手</h3>
    </header>

    <div id="pasteArea" title="点击或在此处粘贴截图">
      <div id="pastePlaceholder">
        <span class="icon">📋</span> <!-- Placeholder icon, can be replaced with SVG or font icon -->
        <div>在此粘贴截图</div>
        <small>(Ctrl+V 或 右键粘贴)</small>
      </div>
      <img id="imagePreview" src="#" alt="Pasted image preview" style="display:none;" />
    </div>

    <div id="loading">正在分析...</div>
    <div id="resultsContainer">
      <!-- Analysis results will be injected here by popup.js -->
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
